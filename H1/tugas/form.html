<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
    <style>
        .align{
            vertical-align: top;
        }
        .right{
            text-align: right;
        }
        input, textarea, select {
            width: 150px;
        }
        .normal {
            width: 50px;
        }
    </style>
</head>
<body>
    <h1>Formulir Pendaftaran Mahasiswa</h1>
    <form>
        <table>
            <tr>
                <td>Nama</td>
                <td>:</td>
                <td><input type="text" name="nama" placeholder="masukan nama" required></td>
            </tr>
            <tr>
                <td>NIM</td>
                <td>:</td>
                <td><input type="number" name="nim" placeholder="masukan nim" required></td>
            </tr>
            <tr>
                <td>Email</td>
                <td>:</td>
                <td><input type="email" name="email" placeholder="masukan email" required></td>
            </tr>
            <tr>
                <td>Program Studi</td>
                <td>:</td>
                <td><select name="prodi" id="prodi" required>
                    <option value="Informatika">Informatika</option>
                    <option value="Sistem Informasi">Sistem Informasi</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td class="align">Alamat</td>
                <td class="align">:</td>
                <td><textarea name="alamat" id="alamat" rows="3" placeholder="masukan alamat" required></textarea></td>
            </tr>
            <tr>
                <td></td>
                <td></td>
                <td class="right"><input class="normal" type="submit" name="kirim" value="kirim"></td>
            </tr>
        </table>
    </form>
    <p><a href="index.html">Kembali ke Data Mahasiswa</a></p>
</body>
</html>
